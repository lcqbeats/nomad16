<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>NOMAD-16 LITE</title>
<!-- Version très légère pour vieux iPad (iOS 9) : pads, kits, filtre, écho. JavaScript ES5 écrit à la main, sans bibliothèque.
     Mise à jour uniquement à la demande (elle ne suit pas index.html). -->
<style>
html, body { margin: 0; padding: 0; height: 100%; background: #0c0b0a; color: #ece3d3; font-family: Menlo, Courier, monospace; overflow: hidden; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: rgba(0,0,0,0); }
#app { position: absolute; top: 0; left: 0; right: 0; bottom: 0; padding: 10px; box-sizing: border-box; }
#top { position: absolute; left: 10px; right: 10px; top: 10px; height: 54px; }
#logo { position: absolute; left: 0; top: 0; font: bold 22px Helvetica, Arial, sans-serif; letter-spacing: 1px; line-height: 54px; }
#logo b { color: #d92b2f; }
#lcd { position: absolute; left: 182px; right: 0; top: 0; height: 54px; background: #102018; border: 2px solid #050505; border-radius: 5px; color: #7dffa6; box-sizing: border-box; padding: 4px 8px; font-size: 15px; line-height: 22px; overflow: hidden; white-space: nowrap; }
#lcd span { opacity: .6; }
#ctl { position: absolute; left: 10px; right: 10px; top: 72px; height: 96px; }
.btn { position: absolute; background: #2b2825; color: #ece3d3; border-radius: 6px; text-align: center; font: bold 13px Helvetica, Arial, sans-serif; letter-spacing: 1px; line-height: 40px; height: 40px; }
.btn.on { background: #ece3d3; color: #0c0b0a; }
.sl { position: absolute; height: 44px; top: 50px; }
.sl .lab { position: absolute; left: 0; top: 0; font-size: 10px; letter-spacing: 1px; color: #8f877a; }
.sl .bar { position: absolute; left: 0; right: 0; top: 18px; height: 22px; background: #2b2825; border-radius: 4px; overflow: hidden; }
.sl .fill { position: absolute; left: 0; top: 0; bottom: 0; background: #d92b2f; }
#pads { position: absolute; left: 10px; right: 10px; bottom: 10px; }
.pad { position: absolute; background: #34302c; border-radius: 8px; box-sizing: border-box; border-left: 5px solid #d92b2f; padding: 6px 8px; font: bold 13px Helvetica, Arial, sans-serif; color: #ece3d3; overflow: hidden; }
.pad.g { border-left-color: #1d9c74; }
.pad small { display: block; font: 10px Menlo, monospace; color: #8f877a; margin-bottom: 4px; }
.pad.hit { background: #d92b2f; }
.pad.g.hit { background: #1d9c74; }
#start { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: #0c0b0a; z-index: 9; text-align: center; }
#start div { position: absolute; left: 50%; top: 50%; width: 300px; height: 150px; margin: -75px 0 0 -150px; }
#start b { display: block; background: #d92b2f; color: #fff; font: bold 26px Helvetica, Arial, sans-serif; letter-spacing: 2px; line-height: 80px; border-radius: 12px; }
#start p { color: #8f877a; font-size: 12px; line-height: 18px; }
</style>
</head>
<body>
<div id="app">
  <div id="top"><div id="logo">NOMAD<b>-16</b> <small style="font-size:11px;color:#8f877a">LITE</small></div><div id="lcd"><span>KIT</span> — <br><span>MIDI</span> en attente…</div></div>
  <div id="ctl"></div>
  <div id="pads"></div>
</div>
<div id="start"><div><b>ALLUMER</b><p>Touchez pour démarrer le son.<br>Coupez le mode silencieux si vous n'entendez rien.</p></div></div>
<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var ctx = null, master, filt, echoIn, echoFb, delay;
  var buffers = [], names = [], gains = [], voices = [], kits = [], kitI = 0, kitTicket = 0, lastPad = 0, full = false, midiName = "en attente…";
  var knob = { vol: 0.8, filt: 1, echo: 0, tune: 0.5 };
  var padEls = [], sliders = {};

  function lcd() {
    var k = kits[kitI];
    $("lcd").innerHTML = "<span>KIT</span> " + (k ? k.name : "—") + " <span>· PAD</span> " + (lastPad + 1) + " " + (names[lastPad] || "") + "<br><span>MIDI</span> " + midiName;
  }

  // ---------- Audio ----------
  function start() {
    if (ctx) return;
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) { $("start").querySelector("p").innerHTML = "Web Audio n'est pas disponible ici."; return; }
    ctx = new AC();
    // déverrouillage iOS : un son muet joué pendant le toucher
    var b = ctx.createBuffer(1, 1, 22050), s = ctx.createBufferSource(); s.buffer = b; s.connect(ctx.destination); s.start(0);
    master = ctx.createGain(); master.gain.value = knob.vol;
    filt = ctx.createBiquadFilter(); filt.type = "lowpass"; filt.frequency.value = 20000; filt.Q.value = 1;
    delay = ctx.createDelay(2); delay.delayTime.value = 0.375;
    echoFb = ctx.createGain(); echoFb.gain.value = 0.42;
    var eLp = ctx.createBiquadFilter(); eLp.type = "lowpass"; eLp.frequency.value = 2500;
    echoIn = ctx.createGain(); echoIn.gain.value = 0;
    filt.connect(master); master.connect(ctx.destination);
    filt.connect(echoIn); echoIn.connect(delay); delay.connect(eLp); eLp.connect(echoFb); echoFb.connect(delay); eLp.connect(master);
    $("start").style.display = "none";
    loadIndex();
    initMidi();
  }
  $("start").addEventListener("touchend", function (e) { e.preventDefault(); start(); });
  $("start").addEventListener("click", start);

  function get(url, type, ok, ko) {
    var x = new XMLHttpRequest(); x.open("GET", url, true); x.responseType = type;
    x.onload = function () { if (x.status === 200 || x.status === 0) ok(x.response); else if (ko) ko(); };
    x.onerror = function () { if (ko) ko(); };
    x.send();
  }
  function loadIndex() {
    get("kits/index.json?" + Date.now(), "text", function (t) {
      try { kits = JSON.parse(t).kits || []; } catch (e) { kits = []; }
      var saved = 0; try { saved = +localStorage.getItem("nomadlite.kit") || 0; } catch (e) {}
      loadKit(saved < kits.length ? saved : 0);
    }, function () { midiName = "kits introuvables (réseau ?)"; lcd(); });
  }
  function loadKit(i) {
    if (!kits.length) return;
    kitI = (i + kits.length) % kits.length;
    try { localStorage.setItem("nomadlite.kit", kitI); } catch (e) {}
    var k = kits[kitI], ticket = ++kitTicket, base = "kits/" + k.id + "/";
    lcd();
    get(base + "kit.json", "text", function (t) {
      var j; try { j = JSON.parse(t); } catch (e) { return; }
      var n = 0, nb = [], nn = [], ng = [];
      // un fichier à la fois : moins de mémoire d'un coup sur les vieux iPad
      (function next() {
        if (ticket !== kitTicket) return;
        if (n >= 16 || n >= j.pads.length) { buffers = nb; names = nn; gains = ng; drawPads(); lcd(); return; }
        var p = j.pads[n], idx = n;
        nn[idx] = p.name; ng[idx] = p.gain || 1;
        get(base + p.file, "arraybuffer", function (ab) {
          ctx.decodeAudioData(ab, function (buf) { nb[idx] = buf; n++; next(); }, function () { n++; next(); });
        }, function () { n++; next(); });
      })();
    });
  }
  function stopVoice(i, t) {
    var v = voices[i]; if (!v) return;
    try { v.g.gain.cancelScheduledValues(t); v.g.gain.setValueAtTime(v.g.gain.value, t); v.g.gain.setTargetAtTime(0, t, 0.005); v.s.stop(t + 0.05); } catch (e) {}
    voices[i] = null;
  }
  function play(i, vel, semis) {
    lastPad = i; flash(i);
    if (!ctx || !buffers[i]) { lcd(); return; }
    var t = ctx.currentTime;
    stopVoice(i, t);
    if (i === 2) stopVoice(3, t); // le hat ferme l'open hat
    var s = ctx.createBufferSource(), g = ctx.createGain();
    s.buffer = buffers[i];
    s.playbackRate.value = Math.pow(2, ((semis || 0) + (knob.tune - 0.5) * 24) / 12);
    g.gain.value = (full ? 1 : 0.2 + 0.8 * vel) * (gains[i] || 1);
    s.connect(g); g.connect(filt);
    s.start(t);
    voices[i] = { s: s, g: g };
    s.onended = function () { if (voices[i] && voices[i].s === s) voices[i] = null; };
    lcd();
  }
  function setKnob(k, v) {
    knob[k] = v;
    if (sliders[k]) sliders[k].style.width = Math.round(v * 100) + "%";
    if (!ctx) return;
    var t = ctx.currentTime;
    if (k === "vol") master.gain.setTargetAtTime(v, t, 0.02);
    if (k === "filt") filt.frequency.setTargetAtTime(60 * Math.pow(20000 / 60, v), t, 0.02);
    if (k === "echo") echoIn.gain.setTargetAtTime(v * 0.8, t, 0.02);
  }

  // ---------- Interface ----------
  function flash(i) { var el = padEls[i]; if (!el) return; el.className = el.className.replace(" hit", "") + " hit"; clearTimeout(el._t); el._t = setTimeout(function () { el.className = el.className.replace(" hit", ""); }, 100); }
  function drawPads() {
    for (var i = 0; i < 16; i++) if (padEls[i]) padEls[i].innerHTML = "<small>" + (i + 1 < 10 ? "0" : "") + (i + 1) + "</small>" + (names[i] || "");
  }
  function button(label, x, w, fn) {
    var b = document.createElement("div"); b.className = "btn"; b.innerHTML = label; b.style.left = x; b.style.width = w; b.style.top = "0";
    b.addEventListener("touchstart", function (e) { e.preventDefault(); fn(b); });
    b.addEventListener("mousedown", function () { fn(b); });
    $("ctl").appendChild(b); return b;
  }
  function slider(key, label, x, w) {
    var d = document.createElement("div"); d.className = "sl"; d.style.left = x; d.style.width = w;
    d.innerHTML = '<div class="lab">' + label + '</div><div class="bar"><div class="fill"></div></div>';
    $("ctl").appendChild(d);
    var bar = d.querySelector(".bar"); sliders[key] = d.querySelector(".fill");
    function at(e) { var r = bar.getBoundingClientRect(), tt = e.touches ? e.touches[0] : e; setKnob(key, Math.max(0, Math.min(1, (tt.clientX - r.left) / r.width))); }
    d.addEventListener("touchstart", function (e) { e.preventDefault(); at(e); });
    d.addEventListener("touchmove", function (e) { e.preventDefault(); at(e); });
    d.addEventListener("mousedown", at);
    setKnob(key, knob[key]);
  }
  function build() {
    button("◀ KIT", "0", "15%", function () { loadKit(kitI - 1); });
    button("KIT ▶", "16%", "15%", function () { loadKit(kitI + 1); });
    var fb = button("FULL LEVEL", "32%", "20%", function (b) { full = !full; b.className = full ? "btn on" : "btn"; });
    slider("vol", "VOLUME", "0", "23.5%");
    slider("filt", "FILTRE", "25.5%", "23.5%");
    slider("echo", "ÉCHO", "51%", "23.5%");
    slider("tune", "PITCH", "76.5%", "23.5%");
    for (var i = 0; i < 16; i++) (function (i) {
      var el = document.createElement("div"); el.className = "pad" + (i >= 8 ? " g" : "");
      el.addEventListener("touchstart", function (e) { e.preventDefault(); play(i, 0.85); });
      el.addEventListener("mousedown", function () { play(i, 0.85); });
      $("pads").appendChild(el); padEls[i] = el;
    })(i);
    drawPads(); layout();
  }
  // pads : grille 4×4 qui remplit l'écran, pad 1 en bas à gauche comme sur l'Akai
  function layout() {
    var W = window.innerWidth - 20, top = 178, H = window.innerHeight - top - 10, gap = 10;
    var size = Math.min((W - 3 * gap) / 4, (H - 3 * gap) / 4), w = (W - 3 * gap) / 4;
    var ph = $("pads").style; ph.top = top + "px";
    for (var i = 0; i < 16; i++) {
      var col = i % 4, row = 3 - Math.floor(i / 4), s = padEls[i].style;
      s.left = (col * (w + gap)) + "px"; s.top = (row * (size + gap)) + "px"; s.width = w + "px"; s.height = size + "px";
    }
  }
  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", function () { setTimeout(layout, 300); });
  document.addEventListener("touchmove", function (e) { e.preventDefault(); });

  // ---------- MIDI ----------
  var learned = [];
  function onMidi(e) {
    var d = e.data, st = d[0] & 0xf0, ch = (d[0] & 0x0f) + 1, n = d[1], v = d[2];
    if (st === 0x90 && v > 0) {
      var idx = n - 36;
      if ((ch === 10 || idx >= 0 && idx < 16 && ch !== 1) && idx >= 0 && idx < 16) play(idx, v / 127);
      else play(lastPad, v / 127, n - 60); // clavier : le dernier pad, joué chromatiquement (do central = hauteur d'origine)
    } else if (st === 0xb0) {
      var k = n >= 70 && n <= 73 ? n - 70 : -1;
      if (n === 28) loadKit(kitI - 1); else if (n === 29) loadKit(kitI + 1);
      if (k >= 0) setKnob(["vol", "filt", "echo", "tune"][k], v / 127);
    } else if (st === 0xc0) loadKit(n);
  }
  function initMidi() {
    if (!navigator.requestMIDIAccess) { midiName = "non disponible (ouvrir dans Web MIDI Browser)"; lcd(); return; }
    navigator.requestMIDIAccess().then(function (acc) {
      function refresh() {
        var list = [], ins = typeof acc.inputs === "function" ? acc.inputs() : acc.inputs;
        if (ins && ins.forEach) ins.forEach(function (a, b) { var inp = a && a.name !== undefined ? a : b; if (inp) { inp.onmidimessage = onMidi; list.push(inp.name); } });
        else if (ins && ins.values) { var it = ins.values(), r; while (!(r = it.next()).done) { r.value.onmidimessage = onMidi; list.push(r.value.name); } }
        midiName = list.length ? list.join(", ") : "aucun appareil"; lcd();
      }
      acc.onstatechange = refresh; refresh();
    }, function () { midiName = "refusé"; lcd(); });
  }
  build(); lcd();
})();
</script>
</body>
</html>
